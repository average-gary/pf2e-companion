[package]
name = "pf2e-companion"
version = "0.1.0"
description = "Cross-platform PF2e + Biblical-reskin reference & worldbuilding companion"
authors = ["Gary Krause"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pf2e_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage layer (plan § 2.4)
rusqlite = { version = "0.32", features = ["bundled", "load_extension", "serde_json"] }
sqlite-vec = "0.1"

# Vault watcher (plan § 4.1)
notify = "8"

# Markdown + frontmatter (Phase 1 prep)
pulldown-cmark = "0.12"
serde_yaml = "0.9"

# Async runtime + utilities
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
include_dir = "0.7.4"

[dev-dependencies]
tempfile = "3.27.0"
